# Copier en pia_bench.toml (à côté du classeur) et adapter. Tout est facultatif :
# les valeurs ci-dessous sont les valeurs par défaut.

[catalogue]
path = "Benchmark_Product_Info_1500_questions_COUVERTURE_ELARGIE.xlsx"
sheet = "QUESTIONS_1500"
expected_questions = 1500          # 0 = pas de contrôle

[campaign]
runs_dir = "runs"                  # une sous-dossier par campagne : base, Excel, HTML, captures, journal

[run]
transport = "edge"                 # edge | directline | fake
max_attempts = 3                   # chats neufs par conversation en cas d'incident
turn_timeout = 360
stable_seconds = 6
think_time = 2
between_conversations = 3
backoff_base = 30
rate_limit_cooldown = 600
breaker_threshold = 3
breaker_cooldown = 900
breaker_max_trips = 2
degraded_window = 15               # 0 = désactive la détection de session dégradée
degraded_ratio = 0.8

[edge]
channel = "msedge"
profile_dir = ".edge_profile_pia_bench"
headless = false
agent_url = ""                     # laissé vide : rempli par `python -m pia_bench setup`
new_chat = ["url", "button"]       # ouvrir un chat neuf : recharger l'URL de l'agent, sinon le bouton
strict_agent_check = false
# Si Microsoft change l'écran, ajuster ici (sélecteurs CSS testés dans l'ordre) :
# composer_selectors = ['[contenteditable="true"][aria-label="Message Product Info Assistant"]']
# user_selectors = ['[class*="fai-UserMessage"]']
# assistant_selectors = ['[data-testid="copilot-message-reply-div"]']
# new_chat_button = '^(nouvelle conversation|nouveau chat|new chat)\b'

[directline]
# Canal Direct Line de Copilot Studio (Paramètres > Canaux > Application mobile / Site web).
# token_endpoint = "https://…/directline/token?api-version=2022-03-01-preview"
secret_env = "PIA_DIRECTLINE_SECRET"
locale = "fr-FR"

[scoring]
equivalences = "equivalences.csv"

[judge]
model = "claude-opus-5-5"
effort = "low"
